[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Local evidence-backed public-company diligence demo"
requires-python = ">=3.12"
dependencies = [
  "ag-ui-langgraph>=0.0.23",
  "copilotkit>=0.1.76",
  "deepagents>=0.3.5",
  "fastapi>=0.115.14",
  "langchain>=1.2.4",
  "langchain-openai>=1.1.7",
  "langchain-anthropic>=1.3.1",
  "langchain-google-genai>=4.2.0",
  "requests>=2.32.5",
  "python-dotenv>=1.2.1",
  "tavily-python>=0.3.0",
  "uvicorn[standard]>=0.40.0",
]

[tool.setuptools]
py-modules = ["agent", "main", "tools"]

[tool.uv]
package = false

