version: "3.9"

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: deep-research-agent-backend
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8123
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-}
      - DILIGENCE_DATA_DIR=/data
    volumes:
      - diligence-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8123/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deep-research-agent-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - LANGGRAPH_DEPLOYMENT_URL=http://agent:8123
      - PORT=3000
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  diligence-data:
